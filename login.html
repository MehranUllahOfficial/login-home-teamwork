<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#edf3f1">
	<title>Sign in</title>
	<style>
		/* Keep the layout calm and readable on every screen size. */
		:root {
			color-scheme: light;
			font-family: "Segoe UI", system-ui, sans-serif;
			color: #18352f;
			background: #edf3f1;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			min-height: 100svh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background:
				radial-gradient(ellipse at 16% 12%, rgb(255 255 255 / 78%), transparent 36%),
				radial-gradient(ellipse at 88% 90%, rgb(183 218 204 / 62%), transparent 35%),
				linear-gradient(135deg, #edf3f1 0%, #dcebe5 52%, #e9eff5 100%);
		}

		.login-panel {
			width: min(100%, 420px);
			padding: clamp(28px, 7vw, 44px);
			border: 1px solid rgb(255 255 255 / 82%);
			border-radius: 18px;
			background: rgb(255 255 255 / 92%);
			box-shadow: 0 24px 70px rgb(35 68 58 / 13%), 0 3px 12px rgb(35 68 58 / 5%);
			animation: enter 650ms cubic-bezier(.2, .75, .25, 1) both;
		}

		.eyebrow {
			margin: 0 0 10px;
			color: #397663;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #18352f;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2rem, 8vw, 2.5rem);
			font-weight: 500;
			line-height: 1.1;
		}

		.intro {
			margin: 12px 0 30px;
			color: #65756f;
			font-size: 0.95rem;
			line-height: 1.55;
		}

		.field {
			margin-bottom: 19px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			color: #304b43;
			font-size: 0.85rem;
			font-weight: 650;
		}

		input {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid #d4dfda;
			border-radius: 8px;
			outline: none;
			background: #fbfdfc;
			color: #18352f;
			font: inherit;
			transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
		}

		input::placeholder {
			color: #9aa9a3;
		}

		input:focus {
			border-color: #438b72;
			background: #fff;
			box-shadow: 0 0 0 4px rgb(67 139 114 / 16%);
		}

		.password-wrap {
			position: relative;
		}

		.password-wrap input {
			padding-right: 76px;
		}

		.toggle-password {
			position: absolute;
			top: 50%;
			right: 12px;
			padding: 6px 4px;
			transform: translateY(-50%);
			border: 0;
			background: transparent;
			color: #397663;
			cursor: pointer;
			font: inherit;
			font-size: 0.8rem;
			font-weight: 700;
		}

		.toggle-password:hover {
			color: #245744;
		}

		.toggle-password:focus-visible,
		.submit-button:focus-visible {
			outline: 3px solid rgb(67 139 114 / 35%);
			outline-offset: 3px;
		}

		.error-message {
			min-height: 21px;
			margin: -3px 0 14px;
			color: #b42332;
			font-size: 0.84rem;
			line-height: 1.4;
		}

		.submit-button {
			width: 100%;
			min-height: 49px;
			border: 0;
			border-radius: 8px;
			background: #28765b;
			box-shadow: 0 5px 12px rgb(40 118 91 / 18%);
			color: #fff;
			cursor: pointer;
			font: inherit;
			font-size: 0.95rem;
			font-weight: 700;
			transition: background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
		}

		.submit-button:hover {
			transform: translateY(-2px);
			background: #1f634b;
			box-shadow: 0 8px 18px rgb(40 118 91 / 24%);
		}

		.submit-button:active {
			transform: translateY(0);
		}

		.login-panel.shake {
			animation: shake 380ms ease-in-out;
		}

		@keyframes enter {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@keyframes shake {
			0%, 100% { transform: translateX(0); }
			22% { transform: translateX(-8px); }
			45% { transform: translateX(7px); }
			68% { transform: translateX(-5px); }
			86% { transform: translateX(3px); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				scroll-behavior: auto !important;
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}
		}
	</style>
</head>
<body>
	<main class="login-panel" id="login-panel">
		<p class="eyebrow">Welcome back</p>
		<h1>Sign in</h1>
		<p class="intro">Enter your details to continue to your account.</p>

		<form id="login-form" novalidate>
			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" placeholder="Your username" autocomplete="username" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<div class="password-wrap">
					<input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
					<button class="toggle-password" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
				</div>
			</div>

			<p class="error-message" id="error-message" role="alert" aria-live="polite"></p>
			<button class="submit-button" type="submit">Sign in</button>
		</form>
	</main>

	<script>
		// Toggle password visibility without submitting the form.
		const passwordInput = document.getElementById("password");
		const togglePassword = document.getElementById("toggle-password");
		togglePassword.addEventListener("click", () => {
			const isVisible = passwordInput.type === "text";
			passwordInput.type = isVisible ? "password" : "text";
			togglePassword.textContent = isVisible ? "Show" : "Hide";
			togglePassword.setAttribute("aria-pressed", String(!isVisible));
		});

		// Check the entered credentials and give a clear response.
		const loginForm = document.getElementById("login-form");
		const loginPanel = document.getElementById("login-panel");
		const errorMessage = document.getElementById("error-message");

		loginForm.addEventListener("submit", (event) => {
			event.preventDefault();
			const username = document.getElementById("username").value;

			if (username === "admin" && passwordInput.value === "1234") {
				window.location.href = "home.html";
				return;
			}

			errorMessage.textContent = "Incorrect username or password. Please try again.";
			loginPanel.classList.remove("shake");
			void loginPanel.offsetWidth;
			loginPanel.classList.add("shake");
		});

		// Clear stale errors as soon as the user edits either field.
		loginForm.addEventListener("input", () => {
			errorMessage.textContent = "";
		});
	</script>
</body>
</html>
